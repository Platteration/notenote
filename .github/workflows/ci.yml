name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite, which the storage layer uses, needs Node 22.13+.
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # The build renders pages that read settings, so it needs a session secret.
          SESSION_SECRET: ci-build-secret-not-used-at-runtime
