name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # .nvmrc pins the major. node:sqlite, which the storage layer uses, needs
          # Node 22.13+; `engines.node` in package.json carries that tighter bound.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      - name: Build
        run: npm run build
        env:
          # The build renders pages that read settings, so it needs a session secret.
          SESSION_SECRET: ci-build-secret-not-a-real-deployment-key

  # Boots the built app and walks the core flow with scripts/smoke.sh: the one check that
  # runs against a real server rather than a module under test.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SESSION_SECRET: ci-smoke-secret-not-a-real-deployment-key

      # Start, wait and exercise in one step: a background process started in an earlier
      # step is not guaranteed to survive into the next one.
      - name: Boot and walk the core flow
        env:
          SESSION_SECRET: ci-smoke-secret-not-a-real-deployment-key
          DATA_DIR: /tmp/daily-scroll-smoke
          PORT: "3000"
        run: |
          npm start > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/auth/me > /dev/null; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server exited early:"; cat /tmp/server.log; exit 1
            fi
            sleep 1
          done

          bash scripts/smoke.sh

      - name: Server log
        if: failure()
        run: cat /tmp/server.log || true
