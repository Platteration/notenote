name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # .nvmrc pins the major. node:sqlite, which the storage layer uses, needs
          # Node 22.13+; `engines.node` in package.json carries that tighter bound.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      - name: Build
        run: npm run build
        env:
          # The build renders pages that read settings, so it needs a session secret.
          SESSION_SECRET: ci-build-secret-not-a-real-deployment-key

  # Boots the built app and walks the core flow with scripts/smoke.sh: the one check that
  # runs against a real server rather than a module under test. `npm run test:e2e` builds,
  # starts, polls, walks and stops on its own, so this job and a developer run the same thing.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds, starts on a free port with a scratch DATA_DIR, polls /api/health, runs the
      # walk and stops the server by its recorded PID; it prints the server log on failure.
      - run: npm run test:e2e
        env:
          SESSION_SECRET: ci-smoke-secret-not-a-real-deployment-key
